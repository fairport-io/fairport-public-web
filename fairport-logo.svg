<svg width="560" height="110" viewBox="0 0 560 110" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>fairport.io logo</title>
  <desc>fairport.io</desc>
  <defs>
    <style>
      .fp-mark-outer { fill: #1D428A; }
      .fp-mark-mid { fill: #FFC72C; }
      .fp-mark-inner { fill: #1D428A; }
      .fp-mark-dot { fill: #FFC72C; }
      .fp-word { fill: #1D428A; font-family: Georgia, 'Times New Roman', serif; font-size: 68px; font-weight: 400; letter-spacing: -2px; }
      .fp-dot { fill: #FFC72C; font-family: Georgia, 'Times New Roman', serif; font-size: 68px; font-weight: 400; letter-spacing: -2px; }
    </style>
  </defs>
  <g transform="translate(55, 55)">
    <rect x="-52" y="-52" width="104" height="104" rx="6" transform="rotate(45)" class="fp-mark-outer"/>
    <rect x="-30" y="-30" width="60" height="60" rx="3" transform="rotate(45)" class="fp-mark-mid"/>
    <rect x="-14" y="-14" width="28" height="28" rx="2" transform="rotate(45)" class="fp-mark-inner"/>
    <circle cx="0" cy="0" r="5" class="fp-mark-dot"/>
  </g>
  <text x="128" y="78" class="fp-word">fairport<tspan class="fp-dot">.io</tspan></text>
</svg>
